services:
  ticket-api:
    build: .
    container_name: fastapi_uv_dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/src/
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: "sqlite+aiosqlite:///./app.db"
